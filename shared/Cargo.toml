[package]
name = "hyper-vm-policy-shared"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/HypeR-Proj/lib-vm-policy"
publish = false
workspace = "../../../app"

[lib]
crate-type = ["dylib"]
test = false
bench = false
doctest = false

[dependencies]

[dependencies.implementation]
package = "hyper-vm-policy"
path = ".."

[dependencies.hyper-rust-std]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
